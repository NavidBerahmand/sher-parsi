<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شعر پارسی</title>
  <meta name="description" content="خواندن شعر فارسی، ساده و آرام">
  <meta name="theme-color" content="#f5f2e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="شعر پارسی">
  <meta name="sp-bundled" content="1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/lateef-arabic-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lateef-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('sp.settings') || '{}');
      if (s.size) document.documentElement.style.setProperty('--poem-scale', s.size);
      if (!s.themeChosen || s.theme === 'dark') document.documentElement.dataset.theme = 'dark'; // dark by default
    } catch (e) {}
    // The opening card belongs to the home page only.
    if (!/^#?\/?$/.test(location.hash)) document.documentElement.classList.add('no-splash');
  </script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true"><div class="splash-box"><b>شعـــــر پـــارســـی</b><small>برگرفته از گنجور</small></div></div>
  <a class="skip" href="#main">رفتن به متن</a>

  <header class="topbar" id="topbar">
    <button class="menu-btn menu-trigger" aria-label="منو" aria-haspopup="true"><img class="logo-on-light" src="icons/logo.svg" alt=""><img class="logo-on-dark" src="icons/logo-2.svg" alt=""></button>
  </header>

  <div class="mx" id="menu" aria-hidden="true">
    <div class="mx-card" role="dialog" aria-modal="true" aria-label="منو">
      <div class="mx-top"><button type="button" class="lb-x" id="mxX" aria-label="بستن منو"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button><label class="mx-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input type="search" id="mxQ" placeholder="جست‌وجو در همهٔ اشعار" autocomplete="off" enterkeyhint="search" aria-label="جست‌وجو در اشعار"><button type="button" class="mx-clr" id="mxClr" aria-label="پاک کردن" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></label></div>
      <div class="mx-body" id="mxBody">
        <nav class="mx-nav" id="mxNav" aria-label="بخش‌ها">
          <a href="#/" data-nav="home">خانه</a>
          <a href="#/poets" data-nav="poets">همهٔ شاعران</a>
          <a href="#/fal" data-nav="fal">فال حافظ</a>
          <a href="#/saved" data-nav="saved">نشان‌شده‌ها</a>
          <button type="button" id="mxRandom">یک شعر تصادفی</button>
          <button type="button" id="mxAbout">دربارهٔ شعر پارسی</button>
        </nav>
        <div class="mx-res" id="mxRes" hidden aria-live="polite"></div>
      </div>
      <div class="mx-foot">
        <div class="mx-size"><button type="button" id="mxSm" aria-label="حروف کوچک‌تر">آ</button><input type="range" id="mxSz" min="0.8" max="1.6" step="0.05" aria-label="اندازهٔ حروف"><button type="button" id="mxLg" aria-label="حروف بزرگ‌تر">آ</button></div>
        <div class="mx-toggles">
          <button type="button" class="mx-pill" id="mxTheme" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span>حالت شب</span></button>
          <button type="button" class="mx-pill" id="mxHk" aria-pressed="false"><span>اِعراب</span></button>
        </div>
        <p class="mx-ver" id="mxVer"></p>
      </div>
    </div>
  </div>

  <main id="main" tabindex="-1"></main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
