<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>Covers</title>
<style>
@font-face { font-family: Kahroba; src: url(../fonts/kahroba-vf.woff2) format("woff2"); font-weight: 100 900; }
body { margin: 0; background: #2e3326; font-family: Kahroba; padding: 40px; }
.grid { display: grid; grid-template-columns: repeat(3, 230px); gap: 40px 34px; justify-content: center; }
.cover { position: relative; aspect-ratio: 5/7; border-radius: 3px 7px 7px 3px; overflow: hidden; background: var(--bg); color: var(--ink);
  box-shadow: 0 1px 1px rgb(0 0 0/.18), 0 10px 22px -8px rgb(0 0 0/.45); }
.cover::after { content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 9%;
  background: linear-gradient(to left, rgb(0 0 0/.25), rgb(255 255 255/.07) 55%, rgb(0 0 0/.2) 62%, transparent); }
.cover::before { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
  background: repeating-linear-gradient(0deg, rgb(255 255 255/.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgb(0 0 0/.05) 0 1px, transparent 1px 3px); }
.art { position: absolute; top: 0; left: 0; right: 0; height: 59.5%; }
.art svg { width: 100%; height: 100%; display: block; }
.txt { position: absolute; top: 59.5%; bottom: 0; left: 8%; right: 13%; display: flex; flex-direction: column; color: #2b2e22; padding-top: 8%; }
.txt-bg { position: absolute; top: 59.5%; bottom: 0; left: 0; right: 0; background: #e7e1cf; }
.txt b { font-weight: 800; font-variation-settings: "CNTR" 100; font-size: 1.32rem; line-height: 1.35; }
.txt small { margin-top: auto; margin-bottom: 9%; font-size: .66rem; opacity: .75; display: flex; justify-content: space-between; }
</style>
<div class="grid" id="g"></div>
<script type="module">
import { coverSVG, PALETTES } from './covergen.js';
const books = [
  ['غزلیات', 'حافظ شیرازی', 'eslimi', 2], ['رباعیات', 'خیام نیشابوری', 'moon', 3], ['شاهنامه', 'فردوسی', 'girih', 4],
  ['مثنوی معنوی', 'مولانا', 'toranj', 0], ['گلستان', 'سعدی شیرازی', 'cypress', 5], ['بوستان', 'سعدی شیرازی', 'boteh', 1],
];
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
g.innerHTML = books.map(([t, a, m, pi]) => { const { p, svg } = coverSVG({ title: t, author: a, motif: m, palette: PALETTES[pi] });
  return `<div class="cover" style="--bg:${p.bg};--ink:${p.ink}"><div class="art">${svg}</div><div class="txt-bg"></div><div class="txt"><b>${t}</b><small><span>${a}</span></small></div></div>`; }).join('');
</script></html>
